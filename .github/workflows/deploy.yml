name: Deploy to GitHub Pages

on:
  push:
    branches:
      - viteWebsite

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and deploy
        run: |
          # Install dependencies
          npm install
          
          # Build project
          npm run build
          
          # Verify build
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi
          echo "dist directory exists and contains:"
          ls -la dist/
          
          # Store build files
          mkdir -p build-output
          cp -r dist/* build-output/
          if [ "$(ls -A build-output/)" ]; then
            echo "Successfully copied files to build-output:"
            ls -la build-output/
          else
            echo "Error: No files were copied to build-output"
            exit 1
          fi
          
          # Checkout gh-pages branch
          git checkout gh-pages
          
          # Copy files
          if [ ! -d "../build-output" ]; then
            echo "Error: build-output directory not found"
            exit 1
          fi
          
          if [ ! "$(ls -A ../build-output/)" ]; then
            echo "Error: build-output directory is empty"
            exit 1
          fi
          
          echo "Files found in build-output directory:"
          ls -la ../build-output/
          
          # Remove existing files and copy new ones
          echo "Removing existing files..."
          rm -rf *
          echo "Copying new files..."
          cp -r ../build-output/* .
          
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add and commit changes
          git add .
          git commit -m "Update dist folder with new build" || true
          
          # Push changes
          git push origin gh-pages
