name: Deploy to GitHub Pages

on:
  push:
    branches:
      - viteWebsite

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: viteWebsite

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Verify build directory exists
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi
          echo "dist directory exists and contains:"
          ls -la dist/

      - name: Copy build files to temp
        run: |
          # Create temp directory
          mkdir -p temp-build
          # Copy files
          cp -r dist/* temp-build/
          # Verify copy
          if [ "$(ls -A temp-build/)" ]; then
            echo "Successfully copied files to temp-build:"
            ls -la temp-build/
          else
            echo "Error: No files were copied to temp-build"
            exit 1
          fi

      - name: Checkout gh-pages branch
        uses: actions/checkout@v3
        with:
          ref: gh-pages

      - name: Copy files to gh-pages
        run: |
          # First verify if temp-build exists and has files
          if [ ! -d "../temp-build" ]; then
            echo "Error: temp-build directory not found"
            exit 1
          fi
          
          if [ ! "$(ls -A ../temp-build/)" ]; then
            echo "Error: temp-build directory is empty"
            exit 1
          fi
          
          echo "Files found in temp-build:"
          ls -la ../temp-build/
          
          # Now remove existing files and copy new ones
          echo "Removing existing files..."
          rm -rf *
          echo "Copying new files..."
          cp -r ../temp-build/* .

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Add and commit changes
        run: |
          git add .
          git commit -m "Update dist folder with new build" || true

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
