name: Deploy to GitHub Pages

on:
  push:
    branches:
      - viteWebsite

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: viteWebsite

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
        id: checkout

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: build-output

      - name: Verify downloaded files
        run: |
          if [ ! -d "build-output/dist" ]; then
            echo "Error: build-output/dist directory not found after download"
            exit 1
          fi
          echo "build-output/dist directory exists and contains:"
          ls -la build-output/dist/

      - name: Copy files to gh-pages
        run: |
          # Verify source directory exists
          if [ ! -d "build-output/dist" ]; then
            echo "Error: build-output/dist directory not found"
            exit 1
          fi
          
          # Verify source directory has files
          if [ ! "$(ls -A build-output/dist/)" ]; then
            echo "Error: build-output/dist directory is empty"
            exit 1
          fi
          
          echo "Files found in build-output/dist directory:"
          ls -la build-output/dist/
          
          # Now remove existing files and copy new ones
          echo "Removing existing files..."
          rm -rf *
          echo "Copying new files..."
          cp -r build-output/dist/* .

      - name: Copy files to gh-pages
        run: |
          # Verify source directory exists
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found"
            exit 1
          fi

          # Verify source directory has files
          if [ ! "$(ls -A dist/)" ]; then
            echo "Error: dist directory is empty"
            exit 1
          fi

          echo "Files found in dist directory:"
          ls -la dist/

          # Now remove existing files and copy new ones
          echo "Removing existing files..."
          rm -rf *
          echo "Copying new files..."
          cp -r dist/* .

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Add and commit changes
        run: |
          git add .
          git commit -m "Update dist folder with new build" || true

      - name: Push changes
        run: |
          git push origin gh-pages
