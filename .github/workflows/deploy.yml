name: Deploy to GitHub Pages

on:
  push:
    branches:
      - viteWebsite

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: viteWebsite

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Verify build directory exists
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi
          echo "dist directory exists and contains:"
          ls -la dist/

      - name: Create build-output directory
        run: mkdir -p build-output

      - name: Store build files
        run: |
          cp -r dist/* build-output/
          if [ "$(ls -A build-output/)" ]; then
            echo "Successfully copied files to build-output:"
            ls -la build-output/
          else
            echo "Error: No files were copied to build-output"
            exit 1
          fi

      - name: Verify build-output before upload
        run: |
          if [ ! -d "build-output" ] || [ ! "$(ls -A build-output/)" ]; then
            echo "Error: build-output directory is either missing or empty"
            exit 1
          fi

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-output/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          target_branch: gh-pages
          build_dir: build-output/
