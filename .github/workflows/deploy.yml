name: Deploy to GitHub Pages

on:
  push:
    branches:
      - viteWebsite

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: viteWebsite

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=https://zrvhbridmzncjlwalprt.supabase.co" > .env
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpydmhicmlkbXpuY2psd2FscHJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg5Njk2MjIsImV4cCI6MjA2NDU0NTYyMn0.zlUUpbcW7ql1VlbZvQcAShatpjroBS581bblLiYhqi4" >> .env
          echo "Created .env file with contents:"
          cat .env

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
        id: checkout

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: .

      - name: Verify downloaded files
        run: |
          echo "Files found in current directory:"
          ls -la

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Add and commit changes
        run: |
          git add .
          git commit -m "Update gh-pages with build from ${GITHUB_REF#refs/heads/} (${GITHUB_SHA::7})" || true

      - name: Push changes
        run: |
          git push https://$${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages
